<!-- Interactive Script for Live Counter & Telemetry Tick -->
<script>
    (function () {
      const counterEl = document.getElementById('loadCounter');
      const miniBarEl = document.getElementById('coreMiniBar');
      const subStatusEl = document.getElementById('subStatus');
      const consoleLogEl = document.getElementById('consoleLog');
      const bypassBtn = document.getElementById('btnBypass');
      const diagBtn = document.getElementById('btnDiagnostics');

      let currentPercent = 87;
      const statusPhrases = [
        "Optimizing Shaders...",
        "Interweaving Ring 02 Harmonic Rosette Flux...",
        "Validating Zero-Latency Pipeline...",
        "Resolving Subpixel Volumetrics...",
        "Finalizing Obsidian Canvas..."
      ];

      const logPool = [
        "Binding geometry buffers to GPU stream [Thread 04]",
        "Inverse torque rotation steady: Outer(24s) / Mid(-18s) / Inner(12s)",
        "Spectral radiance calculation completed (4.2 GigaRays/s)",
        "Fluted cog iris resonance lock verified: 99.98% coherence",
        "Pipeline stage 03 near convergence threshold"
      ];

      // Dynamic Percent Increment Simulation
      const progressTimer = setInterval(() => {
        if (currentPercent < 99) {
          currentPercent += 1;
          if (counterEl) counterEl.textContent = currentPercent;
          if (miniBarEl) miniBarEl.style.width = currentPercent + '%';

          // Shift status phrase occasionally
          if (currentPercent % 3 === 0 && subStatusEl) {
            const nextIdx = Math.floor(Math.random() * statusPhrases.length);
            subStatusEl.textContent = statusPhrases[nextIdx];
          }

          // Add simulated log line
          if (currentPercent % 4 === 0 && consoleLogEl) {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(2, '0').slice(0, 2);
            const randomLog = logPool[Math.floor(Math.random() * logPool.length)];
            
            const line = document.createElement('div');
            line.className = 'text-on-surface flex items-center gap-2 truncate';
            line.innerHTML = `<span class="text-outline">[${timeStr}]</span> <span class="text-secondary-fixed">STREAM</span> <span class="truncate">${randomLog}</span>`;
            
            consoleLogEl.appendChild(line);
            if (consoleLogEl.children.length > 2) {
              consoleLogEl.removeChild(consoleLogEl.firstElementChild);
            }
          }
        }
      }, 950);

      // Bypass button accelerates loader to 100%
      if (bypassBtn) {
        bypassBtn.addEventListener('click', () => {
          currentPercent = 100;
          if (counterEl) counterEl.textContent = "100";
          if (miniBarEl) miniBarEl.style.width = '100%';
          if (subStatusEl) subStatusEl.textContent = "Ready // All Flux In Equilibrium";
          bypassBtn.innerHTML = `<span>Ready</span><span class="material-symbols-outlined text-[16px]">check</span>`;
          bypassBtn.classList.remove('from-primary-container', 'to-primary');
          bypassBtn.classList.add('bg-secondary-container', 'text-on-secondary');
        });
      }

      // Diagnostics Log interactive feedback
      if (diagBtn) {
        diagBtn.addEventListener('click', () => {
          diagBtn.classList.add('scale-95');
          setTimeout(() => diagBtn.classList.remove('scale-95'), 150);
          if (consoleLogEl) {
            const line = document.createElement('div');
            line.className = 'text-primary-fixed flex items-center gap-2 truncate';
            line.innerHTML = `<span class="text-secondary-fixed">[USER]</span> <span>Diagnostics snapshot exported to telemetry buffer.</span>`;
            consoleLogEl.appendChild(line);
            if (consoleLogEl.children.length > 2) {
              consoleLogEl.removeChild(consoleLogEl.firstElementChild);
            }
          }
        });
      }
    })();
